[project]
name = "tui-guess-the-number-bots"
dynamic =["version"]
description = "TUI for guessing the number. Bots in seperate dockerfile"
requires-python = ">=3.14.6"

# [EXTERNAL_DEPENDENCIES]:
dependencies =[
    "python-dotenv>=1.2.2",
    "pyyaml==6.0.1",
    "alex-ber-utils>=0.15.2",
    "fastapi>=0.141.1",
    "structlog>=26.1.0, <27.0.0",
    "uvicorn[standard]>=0.52.1",
    "msgspec>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [POINTER_ALLOCATION]: Directing the transpiler to the isolated OR
[tool.hatch.build.targets.wheel]
packages =["src/tui-guess-the-number-bots"]

[tool.hatch.version]
path = "src/tui-guess-the-number-bots/__init__.py"

[dependency-groups]
dev = [
    "httpx>=0.28.1, <1.0.0",
]

